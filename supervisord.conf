[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:kasmvnc]
command=/usr/local/bin/start-kasmvnc.sh
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/kasmvnc.log
stderr_logfile=/var/log/supervisor/kasmvnc.err.log

[program:openclaw]
command=/usr/local/bin/start-openclaw.sh
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/openclaw.log
stderr_logfile=/var/log/supervisor/openclaw.err.log
environment=HOME="/home/kasm",USER="kasm",OPENCLAW_PORT="%(ENV_OPENCLAW_PORT)s",OPENCLAW_HOME="/data/.openclaw",OPENCLAW_ALLOW_UNCONFIGURED="0"
